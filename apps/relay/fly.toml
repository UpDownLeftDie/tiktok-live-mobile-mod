# Fly.io config for the relay container.
# This is ONE deploy option — not free for new Fly accounts.
# See README for homelab / VPS alternatives.
#
# Deploy from the repo root (Dockerfile copies workspace files):
#   fly apps create tiktok-mod-relay
#   fly secrets set EULER_API_KEY=... RELAY_SECRET=... WORKER_URL=https://your-worker.workers.dev
#   pnpm deploy:relay
#   # or: fly deploy . --config apps/relay/fly.toml --ha=false --no-public-ips --yes

app = "tiktok-mod-relay"
primary_region = "iad"

[build]
  # Path is relative to this fly.toml (apps/relay/). Build context is the repo
  # root (`fly deploy .` / `fly deploy ../..`) so the Dockerfile COPY paths work.
  dockerfile = "Dockerfile"

[env]
  POLL_INTERVAL_MS = "5000"

# No HTTP service: this process only polls the Worker and holds TikTok sockets.
# Keep it running even with zero inbound traffic.
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
